<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Главная</title>

  <!-- Фавиконка -->
  <link rel="icon" type="image/svg+xml" href="media/favicon/favicon.svg">
  <link rel="icon" type="image/png" href="media/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="shortcut icon" href="media/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="media/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="media/favicon/site.webmanifest" />

  <!-- ВАЖНО: новый CSS -->

<body>

<header class="header">
  <a href="https://testserver-eight-olive.vercel.app/front/index.html" class="nav-link">🏠 Главная</a>
</header>

<main class="container">

  <section class="info-block">
    <div class="info-card">
      <h2>Список людей в базе:</h2>
      <!--NAMES_PLACEHOLDER-->
      <a href="/peoples" class="button">⚙️ Подробнее</a>
    </div>

    <div class="info-card">
      <!--AVG_AGE_PLACEHOLDER-->
    </div>
  </section>

  <h1>Добавить человека</h1>

  <form action="../peoplesForm" method="post" class="form">
    <label for="id">Укажите ID:</label>
    <input type="number" name="id" id="id" required>

    <label for="name">Укажите имя:</label>
    <input type="text" name="name" id="name" required>

    <label for="age">Укажите возраст:</label>
    <input type="number" name="age" id="age" required>

    <button type="submit" class="button">Добавить</button>
  </form>

  <section class="media-links">
    <a href="/img" class="media-btn">📷 Смотреть фото</a>
    <a href="/mp3" class="media-btn">🎵 Слушать музыку</a>
    <a href="/video" class="media-btn">🎬 Смотреть видео</a>
  </section>

</main>

</body>
</html>
